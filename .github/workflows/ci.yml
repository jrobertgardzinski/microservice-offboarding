name: CI

# microservice-offboarding is self-contained code-wise, but its provider tests verify the sibling
# repos' committed pacts (the purge command the participants read, the outcome security reads),
# so the checkouts use the workspace layout. Consumer repos are checkout-only (their pacts/), no
# build. The reactor CI (in the aggregator repo) still validates everything together.
#
# The layout is portal/<repo> and shared/<repo>, not flat, and that matters: the three content
# participants are portal siblings (`../microservice-memes` and friends) but security lives one
# level up in the shared kernel (`../../shared/microservice-security`). A flat checkout resolves
# that second path ABOVE $GITHUB_WORKSPACE, where nothing exists, so until 2026-07-29
# SecurityOutcomePactProviderTest was @EnabledIf-skipped on every run — the PORTAL_CONTENT_PURGED /
# PORTAL_PURGE_FAILED envelope EventsRouter.outcome() routes on was verified nowhere in this repo,
# and the security checkout that was supposed to enable it served no purpose. The four content
# pacts only worked by accident of the flat layout coinciding with the portal one.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: portal/microservice-offboarding
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-memes
          path: portal/microservice-memes
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-comments
          path: portal/microservice-comments
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-user-collections
          path: portal/microservice-user-collections
      # the shared kernel, one level up — see the note at the top
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-security
          path: shared/microservice-security
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (including pact provider verification)
        run: mvn -B --no-transfer-progress -f portal/microservice-offboarding/pom.xml clean verify

      # Does the thing we just built actually START?
      #
      # `mvn verify` cannot answer that, and on 2026-07-29 it proved it twice in one afternoon over
      # in microservice-security. Tests run on the TEST classpath and construct objects by hand; the
      # service runs on its packaged jar. A dependency declared with a narrower scope vanished from
      # the runtime libs (NoClassDefFoundError on boot) and a bean with two constructors and no
      # @Inject made every health endpoint answer 500 — both through entirely green builds.
      #
      # No infrastructure needed: with DB_URL unset this service falls back to in-memory H2 (see
      # Database#config), which is exactly why that fallback exists. What is under test is the
      # ARTIFACT — that it assembles, wires and answers — not its behaviour, which the suite owns.
      #
      # 500 is the failure being watched for: it means the endpoint itself is broken. 200 and 503
      # are verdicts, and both are acceptable from a service with no broker.
      - name: Prove the packaged service boots and answers its probes
        run: |
          cd portal/microservice-offboarding
          OFFBOARDING_PORT=18094 java -jar target/microservice-offboarding.jar > /tmp/boot-smoke.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:18094/alive && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::the packaged service died during startup"
              tail -40 /tmp/boot-smoke.log
              exit 1
            fi
            sleep 2
          done
          fail() { echo "::error::$1"; tail -40 /tmp/boot-smoke.log; kill "$pid" 2>/dev/null; exit 1; }
          for path in /alive /health /metrics; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:18094$path" || echo 000)
            case "$code" in
              200|503) echo "$path: $code" ;;
              *) fail "$path answered $code — the manifest probes it and would never pass" ;;
            esac
          done
          kill "$pid" 2>/dev/null || true


      # A skipped verification reads green — that is exactly how the security outcome pact went
      # unverified for weeks — so the run says out loud that all four executed interactions.
      - name: Prove the pact verifications actually ran
        if: always()
        run: |
          reports=portal/microservice-offboarding/target/surefire-reports
          check() {
            file="$reports/TEST-$1.xml"
            if [ ! -f "$file" ]; then
              echo "::error::$1 produced no surefire report — it never ran."
              ls -1 "$reports" || true
              exit 1
            fi
            cases=$(grep -c '<testcase' "$file" || true)
            skips=$(grep -c '<skipped' "$file" || true)
            if [ "$cases" -eq 0 ] || [ "$cases" -eq "$skips" ]; then
              echo "::error::$1 executed no interaction ($cases case(s), $skips skipped)."
              echo "The consumer pact is not where @PactFolder looks — check the checkout paths."
              exit 1
            fi
            echo "$1: $cases interaction(s) verified, $skips skipped."
          }
          check com.jrobertgardzinski.offboarding.infrastructure.SecurityOutcomePactProviderTest
          check com.jrobertgardzinski.offboarding.contracts.memes.MemesCommandPactProviderTest
          check com.jrobertgardzinski.offboarding.contracts.comments.CommentsCommandPactProviderTest
          check com.jrobertgardzinski.offboarding.contracts.collections.CollectionsCommandPactProviderTest
